<!DOCTYPE html>
<html>
  <head>
    <title>Bhanu's Profile</title>
    <style>
      body {
        background-color: #f0f4ff;
        font-family: Arial;
        display: flex;
        justify-content: center;
        margin-top: 60px;
      }

      .card {
        background-color: white;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        width: 300px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }

      h1 {
        color: deeppink;
        font-size: 24px;
      }

      p {
        color: #555;
        font-size: 16px;
      }

      .btn {
        display: inline-block;
        background-color: deeppink;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
      }

      .btn:hover {
        background-color: hotpink;
      }

      .link {
        display: block;
        margin-top: 12px;
        color: deeppink;
        text-decoration: none;
        font-size: 15px;
      }

      .link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bhanu Prakash</h1>
      <p>📍 Nellore, Andhra Pradesh</p>
      <p>🎓 JNN Chennai</p>
      <p>💻 Aspiring Web Developer</p>

      <button class="btn">📧 Contact Me</button>

      <a href="https://www.linkedin.com" class="link">
        🔗 Visit My LinkedIn
      </a>
    </div>
  </body>
</html>
