<!DOCTYPE html>
<html>
  <head>
    <title>Bhanu's Profile</title>
    <style>
      body {
        background-color: #f0f4ff;
        font-family: Arial;
        display: flex;
        justify-content: center;
        margin-top: 60px;
      }

      .card {
        background-color: white;
        padding: 40px;
        border-radius: 16px;
        text-align: center;
        width: 300px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }

      h1 { color: deeppink; font-size: 24px; }
      p { color: #555; font-size: 16px; }

      .btn {
        display: block;
        background-color: deeppink;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
        width: 100%;
      }

      .btn:hover { background-color: hotpink; }

      #message {
        margin-top: 16px;
        font-size: 15px;
        color: deeppink;
        font-weight: bold;
        min-height: 24px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bhanu Prakash</h1>
      <p>📍 Nellore, Andhra Pradesh</p>
      <p>🎓 JNN Chennai</p>
      <p>💻 Aspiring Web Developer</p>
      <p>🛠️ Skills: HTML, CSS, JavaScript</p>

      <button class="btn" onclick="showMessage()">
        👋 Say Hello
      </button>

      <button class="btn" onclick="changeBackground()">
        🎨 Change Color
      </button>

      <div id="message"></div>
    </div>

    <script>
      function showMessage() {
        document.getElementById("message").innerHTML = 
          "Hello! I am Bhanu Prakash, a Web Developer! 🚀";
      }

      function changeBackground() {
        var colors = ["#f0f4ff", "#fff0f6", "#f0fff4", "#fffbf0"];
        var random = colors[Math.floor(Math.random() * colors.length)];
        document.body.style.backgroundColor = random;
      }
    </script>
  </body>
</html>
